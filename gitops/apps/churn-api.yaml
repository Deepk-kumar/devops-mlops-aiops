apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: churn-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Deepk-kumar/devops-mlops-aiops.git
    targetRevision: main
    path: gitops/charts/churn-api
  destination:
    server: https://kubernetes.default.svc
    namespace: mlops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
