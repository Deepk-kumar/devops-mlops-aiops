image:
  repository: ghcr.io/deepk-kumar/aiops
  tag: "e1cf145"
  pullPolicy: IfNotPresent

drift:
  windowMinutes: 15      # kitni purani predictions drift me ginni hain
  minRows: 500           # isse kam data par verdict nahi (chhote sample me noise se false alarm)
  intervalSeconds: 60
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 1536Mi }

anomaly:
  prometheusUrl: http://kps-prometheus.monitoring.svc.cluster.local:9090
  trainMinutes: 120
  holdoutMinutes: 10
  minTrainPoints: 20     # 20 points = ~10 min ka active traffic
  intervalSeconds: 30
  resources:
    requests: { cpu: 50m, memory: 192Mi }
    limits: { memory: 512Mi }

# Prometheus Operator CRDs hone par hi ServiceMonitor / alerts / dashboard render hote hain
monitoring:
  enabled: true
