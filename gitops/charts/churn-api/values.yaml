replicaCount: 2

image:
  repository: ghcr.io/deepk-kumar/churn-api
  tag: "e1cf145"
  pullPolicy: IfNotPresent

chaos:
  enabled: false         # true karoge to /chaos/* endpoints khulte hain (sirf demo)

drift:
  # Predictions drift-detector ko bhejo (khaali = band)
  ingestUrl: "http://drift-detector.mlops.svc.cluster.local:8000/ingest"

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  cpuUtilization: 70

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

# Prometheus Operator CRDs (Terraform monitoring module se aate hain) hone par hi render hote hain
monitoring:
  enabled: true
