name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["gitops/**", "chaos/**", "Makefile", "terraform/**", "ansible/**", "infra/**", "**.md"]
  pull_request:

env:
  IMAGE: ghcr.io/deepk-kumar/churn-api   # GHCR ke liye lowercase zaruri

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q

  build-and-deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write     # gitops/values.yaml update commit ke liye
      packages: write     # GHCR push ke liye
    steps:
      - uses: actions/checkout@v4

      - name: Short SHA
        id: vars
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: serving/Dockerfile
          push: true
          build-args: MODEL_VERSION=${{ steps.vars.outputs.tag }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # GitOps: image tag manifest me likho, ArgoCD baaki kaam karega
      - name: Update image tag in Helm values
        run: |
          sed -i "s|^  tag: .*|  tag: \"${{ steps.vars.outputs.tag }}\"|" gitops/charts/churn-api/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gitops/charts/churn-api/values.yaml
          git commit -m "ci: deploy churn-api ${{ steps.vars.outputs.tag }} [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
