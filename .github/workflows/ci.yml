name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["gitops/**", "chaos/**", "Makefile", "terraform/**", "ansible/**", "infra/**", "**.md"]
  pull_request:

env:
  SERVING_IMAGE: ghcr.io/deepk-kumar/churn-api   # GHCR ke liye lowercase zaruri
  AIOPS_IMAGE: ghcr.io/deepk-kumar/aiops

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r aiops/requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q

  changes:
    runs-on: ubuntu-latest
    outputs:
      serving: ${{ steps.f.outputs.serving }}
      aiops: ${{ steps.f.outputs.aiops }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            serving:
              - 'serving/**'
              - 'ml/**'
              - 'requirements.txt'
            aiops:
              - 'aiops/**'
              - 'ml/**'

  build-serving:
    needs: [test, changes]
    if: github.event_name == 'push' && needs.changes.outputs.serving == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write     # gitops values.yaml commit
      packages: write     # GHCR push
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: serving/Dockerfile
          push: true
          build-args: MODEL_VERSION=${{ steps.vars.outputs.tag }}
          tags: |
            ${{ env.SERVING_IMAGE }}:${{ steps.vars.outputs.tag }}
            ${{ env.SERVING_IMAGE }}:latest
          cache-from: type=gha,scope=serving
          cache-to: type=gha,mode=max,scope=serving
      - name: GitOps - image tag update
        run: |
          sed -i "s|^  tag: .*|  tag: \"${{ steps.vars.outputs.tag }}\"|" gitops/charts/churn-api/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gitops/charts/churn-api/values.yaml
          git commit -m "ci: deploy churn-api ${{ steps.vars.outputs.tag }} [skip ci]" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((RANDOM % 5 + 2))
          done
          exit 1

  build-aiops:
    needs: [test, changes]
    if: github.event_name == 'push' && needs.changes.outputs.aiops == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: aiops/Dockerfile
          push: true
          tags: |
            ${{ env.AIOPS_IMAGE }}:${{ steps.vars.outputs.tag }}
            ${{ env.AIOPS_IMAGE }}:latest
          cache-from: type=gha,scope=aiops
          cache-to: type=gha,mode=max,scope=aiops
      - name: GitOps - image tag update
        run: |
          sed -i "s|^  tag: .*|  tag: \"${{ steps.vars.outputs.tag }}\"|" gitops/charts/aiops/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gitops/charts/aiops/values.yaml
          git commit -m "ci: deploy aiops ${{ steps.vars.outputs.tag }} [skip ci]" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((RANDOM % 5 + 2))
          done
          exit 1
